<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1f3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hôtel Président">
    <link rel="apple-touch-icon" href="/icons/president/apple-touch-icon.png">
    <link rel="manifest" href="/manifests/president.webmanifest">

    <!-- Sélection du manifest/icônes PWA selon la marque (même build, 3 identités
         installables distinctes) : Président sur /, HP Resort sur /hpresort,
         Administration (Hotelix) sur /admin. Doit s'exécuter avant que le
         navigateur n'évalue l'installabilité, donc script synchrone en <head>. -->
    <script>
      (function () {
        var path = window.location.pathname;
        var brand = "president";
        if (path.includes("/hpresort")) brand = "hpresort";
        else if (path.includes("/admin")) brand = "admin";

        if (brand === "president") return;

        var manifestLink = document.querySelector('link[rel="manifest"]');
        if (manifestLink) manifestLink.href = "/manifests/" + brand + ".webmanifest";

        var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (appleIcon) appleIcon.href = "/icons/" + brand + "/apple-touch-icon.png";

        var themeMeta = document.querySelector('meta[name="theme-color"]');
        var themeColors = { hpresort: "#C4622D", admin: "#0a0a0a" };
        if (themeMeta) themeMeta.setAttribute("content", themeColors[brand]);

        var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        var titles = { hpresort: "HP Resort", admin: "Hotelix" };
        if (titleMeta) titleMeta.setAttribute("content", titles[brand]);
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <title>Hôtel Président — Yamoussoukro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
